[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "amazon-transcribe>=0.6.4",
    "bcrypt>=5.0.0",
    "boto3>=1.43.103",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-aws>=1.7.9",
    "langchain-core>=1.6.5",
    "langgraph>=1.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "moto>=5.2.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
